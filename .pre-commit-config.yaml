# Install: pip install pre-commit && pre-commit install
# Run on everything: pre-commit run --all-files
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1000]
        # Existing large tracked files (library DB, packed models, vendored
        # player, spec PDF, example data).
        exclude: ^(data/|models-packed/|app/vendor/|docs/|examples/)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1  # keep in sync with ruff.toml and CI
    hooks:
      - id: ruff-check
