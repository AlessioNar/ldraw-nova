# Alembic configuration. The connection is never written here: migrations/env.py gets the engine from db.engine
# (password file, or LDRAW_NOVA_DATABASE_URL on a laptop). From app/web/backend:
#   LDRAW_NOVA_DATABASE_URL=postgresql://... alembic revision --autogenerate -m "what changed"
#   (review the generated file by hand: see migrations/README.md)
[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
