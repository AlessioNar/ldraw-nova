<!doctype html>
<!--
  LDraw 3D player: plays back how a model is built (parts drop in step by step
  while the camera turns). ldraw-player, Rust + WebAssembly (wgpu: WebGPU, or
  WebGL2), from tools/player in the ldraw.rs-nova fork; the release zip is
  unpacked into /viewer/player-vendor/ at image build time (see Dockerfile).
  Parts come from the LDraw library baked into the image (/ldraw-id/..., /ldraw/...).

  Usage: /viewer/player.html?model=<url of an .ldr/.mpd>[&parts=<count>][&theme=light|dark]
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LDraw Player</title>
<link rel="stylesheet" href="viewer-common.css">
<link rel="stylesheet" href="player.css">
</head>
<body>
<div id="top" class="bar">
  <span id="title"><strong id="file">LDraw Player</strong><span id="parts"></span></span>
  <span class="segmented" role="group" aria-label="Camera">
    <button data-camera="inspect" aria-pressed="true" title="Orbit, pan and zoom, also into the model">Inspect</button>
    <button data-camera="walk" aria-pressed="false" title="First person: mouse to look, W A S D to move">Walk</button>
  </span>
</div>
<div id="stage"><canvas id="canvas"></canvas></div>
<div id="status">Loading…</div>
<div id="controls" class="bar">
  <button id="prev" class="icon" title="Previous step (←)" aria-label="Previous step" disabled>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5.5 5H8v14H5.5z"/><path d="M18.5 5v14L9 12z"/></svg>
  </button>
  <button id="play" class="icon" title="Play (Space)" aria-label="Play" disabled>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path id="play-icon" d="M8 5v14l11-7z"/></svg>
  </button>
  <button id="next" class="icon" title="Next step (→)" aria-label="Next step" disabled>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5.5 5v14l9.5-7z"/><path d="M16 5h2.5v14H16z"/></svg>
  </button>
  <span id="time" class="readout">0:00 / 0:00</span>
  <div id="scrub" role="slider" tabindex="0" aria-label="Build progress" aria-valuemin="0" aria-valuemax="0" aria-valuenow="0">
    <div id="track"><div id="fill"></div><canvas id="marks"></canvas></div>
    <div id="thumb"></div>
    <div id="tip" hidden></div>
  </div>
  <span id="step" class="readout">Step – / –</span>
  <select id="speed" title="Playback speed" aria-label="Playback speed">
    <option value="0.25">0.25×</option>
    <option value="0.5">0.5×</option>
    <option value="1" selected>1×</option>
    <option value="2">2×</option>
    <option value="4">4×</option>
  </select>
  <button id="home" class="icon" title="Reset view" aria-label="Reset view" disabled>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9V5a2 2 0 0 1 2-2h4v2H5v4zm12-6h4a2 2 0 0 1 2 2v4h-2V5h-4zM3 15h2v4h4v2H5a2 2 0 0 1-2-2zm16 0h2v4a2 2 0 0 1-2 2h-4v-2h4zM12 8.5a3.5 3.5 0 1 1 0 7 3.5 3.5 0 0 1 0-7z"/></svg>
  </button>
</div>

<script src="viewer-common.js"></script>
<script type="module" src="player.js"></script>
</body>
</html>
